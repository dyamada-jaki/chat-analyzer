# SonarQube Scanner設定
# プロジェクトルートで実行: sonar-scanner

# プロジェクト設定
sonar.projectKey=chat-analyzer
sonar.projectName=Chat Analyzer
sonar.projectVersion=1.0.0
sonar.projectDescription=Google Chat感情分析Chrome拡張機能

# ソースコード設定（テストファイルを除外）
sonar.sources=chrome-extension,backend/src
sonar.tests=backend/tests,chrome-extension/tests
sonar.sourceEncoding=UTF-8

# 言語・ファイル設定
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# 除外設定（テストファイル重複を避ける）
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.min.js,**/coverage/**,**/*.d.ts,**/pnpm-lock.yaml,**/.scannerwork/**,**/.sonar/**,**/tests/**/*.js,**/tests/**/*.ts
sonar.test.exclusions=**/node_modules/**,**/dist/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.js,**/*.spec.ts,**/*.spec.js,**/tests/**

# テストカバレッジ設定（パス修正）
sonar.javascript.lcov.reportPaths=coverage-lcov.info,backend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage-lcov.info,backend/coverage/lcov.info

# 品質ゲート設定
sonar.qualitygate.wait=true

# SonarQube Server設定（ローカル環境）
sonar.host.url=http://localhost:9000
sonar.login=sqp_646cbe959d868ab4147d4a556103f9895d386b6a

# Chrome Extension専用設定
sonar.javascript.environments=browser,node